[project]
name = "telegram-bot-channel"
version = "0.1.0"
description = "Telegram Bot Channel implementation for susie"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12.5",
    "susie-core>=0.1.0",
    "python-telegram-bot>=22.7",
    "av>=17.0.1",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["telegram_bot_channel"]
